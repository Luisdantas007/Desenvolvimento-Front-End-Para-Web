<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
  </head>
  <body>
    <h1>Elementos da tabela</h1>
    <p>As tabelas em HTML são usadas para organizar dados em colunas.</p>
    <br />
    <hr />
    <br />
    <table border="1">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>time que torce</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Gustavo</td>
          <td>18</td>
          <td>corinthians</td>
        </tr>
        <tr>
          <td>Bruno</td>
          <td>32</td>
          <td>São Paulo</td>
        </tr>
      </tbody>
    </table>
    
  </body>
</html>

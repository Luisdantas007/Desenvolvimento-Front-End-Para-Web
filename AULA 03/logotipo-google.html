<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logotipo</title>
  </head>
  <body>
    <h1>Exemplo do logotipo com foto</h1>

    <figure
      style="
        text-align: center;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        transform: translateY(-30px);
      "
    >
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0dKnx5nPlIjIbU_-2XKlLtglDjp4zvvElCf3EmS2Vc4qWFPIM4ozS8m0&s=10"
        alt="logotipo com o texto Front-End"
        width="100"
        style="
          border: 3px solid rgba(20, 14, 105, 0.795);
          border-radius: 12px;
          padding: 5px;
        "
      />

      <figcaption>Desenvolvimento Font-End para web</figcaption>
    </figure>
  </body>
</html>

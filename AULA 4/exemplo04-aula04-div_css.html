<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div, br e hr</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 30px;
            margin: 10px;
            border-radius: 10px;
        }
        #principal {
            background-color: rgba(13, 15, 43, 0.527);
            border: 3px solid rgba(65, 60, 60, 0.637);
            color: rgba(0, 0, 0, 0.767);
        }
        #segundária {
            background-color: rgba(129, 5, 5, 0.582);
            border: 3px solid rgba(116, 13, 13, 0.61);
            color: rgba(0, 0, 0, 0.767);
        }
        hr{
            border: none;
            border-top: 3px solid rgba(83, 22, 22, 0.733);
            width: 100%;
        }
    </style>

</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id="segundária">
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>

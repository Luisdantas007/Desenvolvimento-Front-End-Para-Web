<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horario e Previsão do tempo</title>
  </head>
  <body>
    <h1>Horario e Previsão do tempo</h1>

    <p>O programa mostrará uma saudação e uma recomendação do clima atual.</p>

    <script>
      const dataHora = new Date();
      const Hora = dataHora.getHours();

      let previsaoTempo = prompt(
        "Como está o dia hoje? Digite chuvoso ou ensolarado",
      );

      previsaoTempo = previsaoTempo.toLowerCase().trim();

      if (Hora < 12) {
        alert("Bom dia");
        if (previsaoTempo === "chuvoso") {
          alert("Está chovendo, vai ter que voltar nadando!!!");
        } else if (previsaoTempo === "ensolarado") {
          alert("Está ensolarado, vai voltar fedendo!!!");
        } else {
          alert("Nenhuma opção selecionada...");
        }
      } else if (Hora < 18) {
        alert("Boa tarde");
        if (previsaoTempo === "chuvoso") {
          alert("Está chovendo, vai ter que voltar nadando!!!");
        } else if (previsaoTempo === "ensolarado") {
          alert("Está ensolarado, vai voltar fedendo!!!");
        } else {
          alert("Nenhuma opção selecionada...");
        }
      } else {
        alert("Boa Noite");
        if (previsaoTempo === "chuvoso") {
          alert("Está chovendo, vai ter que voltar nadando!!!");
        } else if (previsaoTempo === "ensolarado") {
          alert("Está ensolarado, vai voltar fedendo!!!");
        } else {
          alert("Nenhuma opção selecionada...");
        }
      }
    </script>
  </body>
</html>

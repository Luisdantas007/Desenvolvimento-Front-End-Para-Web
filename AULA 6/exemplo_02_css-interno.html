<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estudando Classes em CSS</title>

    <style>
        .titulo{
            color: rgb(218, 165, 32);
            text-align: center;
        }
        .caixa01{
            background-color: goldenrod;
            border: 2px solid rgb(255, 217, 3);
            border-radius: 15px;
            padding: 20px;
            margin: 20px;
        }
        .caixa02{
            background-color: goldenrod;
            border: 2px solid rgb(255, 217, 3);
            border-radius: 20px;
            padding: 20px;
            margin: 20px;
        }
        .paragrafo01{
            color: rgb(255, 255, 255);
            font-weight: bold;
        }
        .paragrafo02{
            color: rgb(255, 255, 255);
            background-color: rgb(255, 217, 0);
            font-size: oblique;
            padding: 5px;
        }
        p{
            color: rgb(255, 255, 255);
        }


    </style>

</head>
<body>

    <h1 class="titulo">Aprendendo Classes com CSS</h1>

    <div class="caixa01">
        <p class="paragrafo01">Este é o primeiro parágrafo da primeira div.</p>
        <p class="paragrafo02">Este é o segundo parágrafo da primeira div.</p>
    </div>

    <div class="caixa02">
        <p>Este é o único parágrafo da segunda div.</p>
    </div>

</html>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Listas HTML</title>
</head>
<body>
    <h1>Elementos de listas</h1>
    <p>
        As listas em HTML são utilizadas para
        organizar informações em uma sequência.
    </p>
    <h2>----Lista não ordenadas----</h2>
    <ul>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
        <li>item 4</li>
    </ul>
   <h2>----Listas Ordenadas----</h2>
        <ol>
            <li>primeiro item</li>
            <li>segundo item</li>
            <li>terceiro item</li>
            <li>quarto item</li>
        </ol>
   
</body>
</html>
